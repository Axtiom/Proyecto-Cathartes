<!DOCTYPE html>
<!-- ============================================================================
     Pantalla: MAPA de contenedores del vecino (Leaflet/OSM).
     Datos: API Gestión (GET /contenedores/todos).
     JS que la acompaña: js/pantallas/mapa.js (usa el módulo js/mapa.js).
     El texto fijo (título, leyenda) está escrito a mano; los marcadores los pinta
     el módulo de mapa con los datos de la API.
============================================================================= -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa · Cathartes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="assets/leaflet/leaflet.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="app">
    <div data-shell-header></div>

    <main class="app-main">
        <h1 class="app-main__titulo">Mapa de contenedores</h1>
        <p class="app-main__sub">Ubicación y estado de los contenedores. Tocá un marcador para ver el detalle y reportar.</p>

        <div id="mapa-vecino"></div>

        <div class="mapa-leyenda" style="margin-top:14px;display:flex;flex-wrap:wrap;gap:16px">
            <span class="leyenda-item" style="font-size:12px;color:var(--texto-tenue);display:inline-flex;align-items:center">
                <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#38D07E;margin-right:6px"></span>funcional
            </span>
            <span class="leyenda-item" style="font-size:12px;color:var(--texto-tenue);display:inline-flex;align-items:center">
                <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#F5B54A;margin-right:6px"></span>desbordado
            </span>
            <span class="leyenda-item" style="font-size:12px;color:var(--texto-tenue);display:inline-flex;align-items:center">
                <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#F58A8A;margin-right:6px"></span>no funcional
            </span>
            <span class="leyenda-item" style="font-size:12px;color:var(--texto-tenue);display:inline-flex;align-items:center">
                <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#5E6690;margin-right:6px"></span>dado de baja
            </span>
        </div>
    </main>

    <div data-shell-footer></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>window.L || document.write('<script src="assets/leaflet/leaflet.js"><\/script>');</script>
    <script src="js/api.js"></script>
    <script src="js/componentes/toast.js"></script>
    <script src="js/mapa.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/guardia.js"></script>
    <script src="js/pantallas/mapa.js"></script>
</body>
</html>
