<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación en dos pasos · Cathartes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-page="verificar">
    <div class="pantalla">
        <div class="pantalla__amb"></div>
        <div class="pantalla__glow pantalla__glow--verde"></div>
        <div class="pantalla__glow pantalla__glow--lavanda"></div>

        <a class="volver" href="login.html">
            <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Volver
        </a>
        <form class="tarjeta" id="form-principal">
            <div class="marca">
                <svg class="marca__logo" viewBox="0 0 96 96" width="26" height="26" aria-hidden="true">
                    <circle cx="48" cy="48" r="45"   fill="none" stroke="#2E4A54" stroke-width="2"/>
                    <circle cx="48" cy="48" r="38.5" fill="none" stroke="#14B8A6" stroke-width="1.4" opacity="0.55"/>
                    <g fill="#2FBF71">
                        <path d="M48 31 C 60 24 72 23 84 28 C 79 29 81 31 77 31 C 74 31 75 33 71 33 C 68 33 61 32 50 35 Z" transform="translate(96,0) scale(-1,1)"/>
                        <path d="M48 31 C 60 24 72 23 84 28 C 79 29 81 31 77 31 C 74 31 75 33 71 33 C 68 33 61 32 50 35 Z"/>
                        <path d="M48 20 C 51.5 27 52.5 30 51.5 34 C 51 39 50 43 48 47 C 46 43 45 39 44.5 34 C 43.5 30 44.5 27 48 20 Z"/>
                        <path d="M27 66 L27 57.5 Q27 56 28.5 56 L37 56 L40 50.5 Q41 49 42.5 49 L67 49 Q68.5 49 68.5 50.5 L68.5 66 Q68.5 67.5 67 67.5 L28.5 67.5 Q27 67.5 27 66 Z"/>
                    </g>
                    <circle cx="40" cy="68" r="4.3" fill="#2FBF71"/>
                    <circle cx="40" cy="68" r="1.9" fill="#0B1620"/>
                    <circle cx="60" cy="68" r="4.3" fill="#2FBF71"/>
                    <circle cx="60" cy="68" r="1.9" fill="#0B1620"/>
                </svg>
                <span class="marca__nombre">Cathartes</span>
            </div>
            <h1>Verificación en dos pasos</h1>
            <p class="sub">Ingresá el código de 6 dígitos que te enviamos por correo.</p>

            <div class="aviso aviso--dev" id="flash" hidden><p></p></div>
            <div class="aviso aviso--error" id="error-general" hidden>
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
                <p></p>
            </div>

            <div class="otp" role="group" aria-label="Código de verificación de 6 dígitos">
                <input class="otp__caja" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Dígito 1">
                <input class="otp__caja" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 2">
                <input class="otp__caja" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 3">
                <input class="otp__caja" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 4">
                <input class="otp__caja" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 5">
                <input class="otp__caja" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 6">
            </div>
            <input type="hidden" name="codigo" id="codigo">

            <button class="boton" type="submit">Verificar</button>
            <div class="resend">¿No te llegó? <a href="login.html">Volver a intentar</a></div>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/acceso.js"></script>
</body>
</html>
