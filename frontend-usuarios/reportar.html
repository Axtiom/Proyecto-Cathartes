<!-- CONTENEDOR DEL MAPA Y FORMULARIO DE UBICACIÓN -->
<div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Ubicación Geográfica (Montevideo)</h5>
    </div>
    <div class="card-body">
        <div class="row">
            <!-- Mapa interactivo -->
            <div class="col-md-7 mb-3">
                <label class="form-label fw-bold">Haga clic en el mapa para seleccionar la ubicación:</label>
                <div id="mapa-selector" style="height: 400px; width: 100%; border-radius: 8px; border: 1px solid #ced4da;"></div>
            </div>
            
            <!-- Campos estructurados -->
            <div class="col-md-5">
                <div class="mb-3">
                    <label for="input-calle" class="form-label">Calle y Número (*)</label>
                    <input type="text" id="input-calle" class="form-control" required placeholder="Ej: Felipe Sanguinetti 2683">
                </div>
                <div class="mb-3">
                    <label for="input-esquina" class="form-label">Esquina (Opcional)</label>
                    <input type="text" id="input-esquina" class="form-control" placeholder="Ej: Fray Bentos">
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label for="input-lat" class="form-label">Latitud</label>
                        <input type="text" id="input-lat" class="form-control bg-light" readonly>
                    </div>
                    <div class="col-6 mb-3">
                        <label for="input-lng" class="form-label">Longitud</label>
                        <input type="text" id="input-lng" class="form-control bg-light" readonly>
                    </div>
                </div>
                <div class="form-text text-muted">
                    Las coordenadas y la dirección se completan automáticamente al marcar el punto en el mapa.
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Dependencias CSS y JS de Leaflet (Asegúrate de incluirlas si no las tienes en el head) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // Coordenadas centrales de Montevideo por defecto
    const mvdLat = -34.9011;
    const mvdLng = -56.1645;

    // Inicializar el mapa centrado en Montevideo
    const map = L.map('mapa-selector').setView([mvdLat, mvdLng], 13);

    // Capa de mapa base (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;

    // Evento de clic sobre el mapa
    map.on('click', async function(e) {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;

        // Actualizar o colocar el marcador gráfico
        if (marker) {
            marker.setLatLng(e.latlng);
        } else {
            marker = L.marker(e.latlng).addTo(map);
        }

        // Rellenar campos de latitud y longitud
        document.getElementById('input-lat').value = lat.toFixed(6);
        document.getElementById('input-lng').value = lng.toFixed(6);

        // Petición de Geocodificación Inversa (Nominatim)
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
            const data = await response.json();

            if (data && data.address) {
                const road = data.address.road || '';
                const houseNumber = data.address.house_number || '';
                
                // Construir Calle y Número
                const calleNum = houseNumber ? `${road} ${houseNumber}` : road;
                document.getElementById('input-calle').value = calleNum || 'Ubicación seleccionada en mapa';

                // Intentar capturar cruce o esquina si la API lo provee
                const esquinaRef = data.address.pedestrian || data.address.suburb || '';
                document.getElementById('input-esquina').value = esquinaRef;
            }
        } catch (error) {
            console.error("No se pudo resolver la dirección automáticamente:", error);
            document.getElementById('input-calle').value = `Coordenadas: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        }
    });
});
</script>
