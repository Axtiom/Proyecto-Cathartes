<!DOCTYPE html>
<!-- ============================================================================
     Pantalla: REPORTAR incidencia (formulario con foto obligatoria).
     Datos: API Gestión (GET /contenedores para el selector, POST /vecino/incidencias).
     JS que la acompaña: js/pantallas/reportar.js
     Etiquetas, ayudas y tipos de incidencia escritos a mano; el selector de
     contenedores se llena desde la tabla contenedor por API.
============================================================================= -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar incidencia · Cathartes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="assets/leaflet/leaflet.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="app">
    <div data-shell-header></div>

    <main class="app-main">
        <h1 class="app-main__titulo">Reportar incidencia</h1>
        <p class="app-main__sub">Elegí el contenedor, sacá o subí una foto y contanos qué pasa.</p>

        <form class="form-app" id="r-form">
            <div class="campo-app">
                <label for="r-contenedor">Contenedor</label>
                <select id="r-contenedor" required>
                    <option value="">Elegí un contenedor…</option>
                </select>
                <div class="campo-app__ayuda">Ubicación: <span id="r-ubicacion">—</span></div>
                <div id="reportar-mapa" style="margin-top:10px"></div>
            </div>

            <div class="campo-app foto-campo">
                <label>Foto <span style="color:var(--rojo)">*</span> (obligatoria)</label>
                <div class="foto-drop" id="r-drop">
                    <span id="r-drop-txt">Tocá para elegir una foto (PNG o JPG, hasta 10 MB)</span>
                    <img class="foto-preview" id="r-preview" alt="Vista previa" hidden>
                </div>
                <input type="file" id="r-foto" accept="image/png,image/jpeg">
            </div>

            <div class="campo-app">
                <label for="r-tipo">Tipo de incidencia</label>
                <select id="r-tipo" required>
                    <option value="">Elegí un tipo…</option>
                    <option value="desbordado">desbordado</option>
                    <option value="roto">roto</option>
                    <option value="falta de recoleccion">falta de recoleccion</option>
                </select>
            </div>

            <div class="campo-app">
                <label for="r-desc">Descripción (opcional)</label>
                <textarea id="r-desc" placeholder="Contanos algún detalle…"></textarea>
            </div>

            <button type="submit" class="cta" id="r-enviar" disabled>Reportar incidencia</button>
        </form>
    </main>

    <div data-shell-footer></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>window.L || document.write('<script src="assets/leaflet/leaflet.js"><\/script>');</script>
    <script src="js/api.js"></script>
    <script src="js/componentes/toast.js"></script>
    <script src="js/mapa.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/guardia.js"></script>
    <script src="js/pantallas/reportar.js"></script>
</body>
</html>
