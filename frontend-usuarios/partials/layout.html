<!-- ============================================================================
     partials/layout.html — Header y footer compartidos del Frontend de Usuarios.
     ----------------------------------------------------------------------------
     Son la misma cáscara en las 8 pantallas, así que viven acá UNA sola vez y
     js/layout.js los clona. Regla "el HTML manda": toda la estructura y el texto
     fijo (nav, columnas del footer, teléfono, correo, bajada) están escritos acá,
     legibles; el JS solo rellena los data-campo (nombre, rol, saldo, iniciales) y
     engancha eventos (menú del avatar, cerrar sesión).
============================================================================= -->

<template id="tpl-header">
    <header class="hdr">
        <a class="hdr__marca" href="inicio.html">
            <span class="hdr__logo" aria-hidden="true">
                <svg viewBox="0 0 96 96" width="24" height="24">
                    <circle cx="48" cy="48" r="45" fill="none" stroke="#2E4A54" stroke-width="2"/>
                    <circle cx="48" cy="48" r="38.5" fill="none" stroke="#14B8A6" stroke-width="1.4" opacity="0.55"/>
                    <g fill="#2FBF71">
                        <path d="M48 31 C 60 24 72 23 84 28 C 79 29 81 31 77 31 C 74 31 75 33 71 33 C 68 33 61 32 50 35 Z" transform="translate(96,0) scale(-1,1)"/>
                        <path d="M48 31 C 60 24 72 23 84 28 C 79 29 81 31 77 31 C 74 31 75 33 71 33 C 68 33 61 32 50 35 Z"/>
                        <path d="M48 20 C 51.5 27 52.5 30 51.5 34 C 51 39 50 43 48 47 C 46 43 45 39 44.5 34 C 43.5 30 44.5 27 48 20 Z"/>
                        <path d="M27 66 L27 57.5 Q27 56 28.5 56 L37 56 L40 50.5 Q41 49 42.5 49 L67 49 Q68.5 49 68.5 50.5 L68.5 66 Q68.5 67.5 67 67.5 L28.5 67.5 Q27 67.5 27 66 Z"/>
                    </g>
                    <circle cx="40" cy="68" r="4.3" fill="#2FBF71"/><circle cx="40" cy="68" r="1.9" fill="#0B1620"/>
                    <circle cx="60" cy="68" r="4.3" fill="#2FBF71"/><circle cx="60" cy="68" r="1.9" fill="#0B1620"/>
                </svg>
            </span>
            <span>Cathartes</span>
        </a>

        <nav class="hdr__nav">
            <a class="hdr__link" href="inicio.html"          data-nav="inicio">Inicio</a>
            <a class="hdr__link" href="reportar.html"        data-nav="reportar">Reportar</a>
            <a class="hdr__link" href="mis-incidencias.html" data-nav="mis-incidencias">Mis incidencias</a>
            <a class="hdr__link" href="mapa.html"            data-nav="mapa">Mapa</a>
            <a class="hdr__link" href="recompensas.html"     data-nav="recompensas">Recompensas</a>
        </nav>

        <div class="hdr__derecha">
            <span class="badge-puntos" data-badge hidden title="Puntos disponibles">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 21.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>
                <span><b data-campo="saldo">0</b> pts</span>
            </span>

            <div class="avatar">
                <button class="avatar__btn" type="button" data-avatar-btn aria-haspopup="true" aria-expanded="false" data-campo="iniciales">JP</button>
                <div class="avatar__menu" data-avatar-menu hidden>
                    <div class="avatar__nombre">
                        <b data-campo="nombre">Nombre del usuario</b>
                        <span data-campo="rol">rol</span>
                    </div>
                    <a class="avatar__item" href="perfil.html">Mi perfil</a>
                    <button class="avatar__item avatar__item--peligro" type="button" data-accion="logout">Cerrar sesión</button>
                </div>
            </div>
        </div>
    </header>
</template>
