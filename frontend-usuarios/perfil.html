<!DOCTYPE html>
<!-- ============================================================================
     Pantalla: MI PERFIL (datos personales + personalización de marcos).
     Datos: API de Usuarios — GET /perfil, POST /perfil (datos), GET /mis-canjes
            (marcos desbloqueados por canjes).
     JS que la acompaña: js/pantallas/perfil.js
     Regla "el HTML manda": el form, los labels, los tabs y los textos fijos están
     acá; el JS solo rellena valores, clona los <template> (fila de teléfono, marco)
     y engancha eventos (tabs, agregar/quitar teléfono, guardar).
============================================================================= -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil · Cathartes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="app">
    <div data-shell-header></div>

    <main class="app-main">
        <h1 class="app-main__titulo">Mi perfil</h1>

        <div class="tabs">
            <button type="button" class="chip" id="p-tab-datos">Datos personales</button>
            <button type="button" class="chip" id="p-tab-pers">Personalización</button>
        </div>

        <div id="p-panel-datos">
            <form class="form-app" id="p-form">
                <div class="campo-app">
                    <label for="p-nombre">Nombre</label>
                    <input type="text" id="p-nombre" required>
                </div>
                <div class="campo-app">
                    <label for="p-email">Correo electrónico</label>
                    <input type="email" id="p-email" required>
                </div>
                <div class="campo-app">
                    <label>Teléfonos</label>
                    <div id="p-telefonos"></div>
                    <button type="button" class="chip" id="p-add-tel" style="align-self:flex-start">＋ Agregar teléfono</button>
                </div>
                <button type="submit" class="cta">Guardar cambios</button>
            </form>
        </div>

        <div id="p-panel-pers" hidden>
            <p class="app-main__sub">Marcos de perfil desbloqueados según tus canjes.</p>
            <div class="catalogo" id="p-marcos"></div>
            <div class="vacio" id="p-marcos-vacio" hidden>
                <p class="vacio__titulo">Sin marcos desbloqueados</p>
                <p class="vacio__texto">Canjeá recompensas para desbloquear marcos de perfil.</p>
            </div>
        </div>
    </main>

    <div data-shell-footer></div>

    <!-- Molde de una fila de teléfono (el input arranca vacío; el JS lo clona). -->
    <template id="tpl-telefono">
        <div class="p-tel-fila" style="display:flex;gap:8px;margin-bottom:8px">
            <input type="text" class="p-tel" placeholder="09X XXX XXX"
                   style="flex:1;background:var(--superficie2);border:1px solid var(--borde);border-radius:10px;color:var(--texto);font:inherit;padding:10px 12px">
            <button type="button" class="chip" data-quitar>✕</button>
        </div>
    </template>

    <!-- Molde de una tarjeta de marco desbloqueado (valores de muestra). -->
    <template id="tpl-marco">
        <div class="panel" style="cursor:pointer">
            <div class="principal" data-campo="nombre">Marco «Reciclador»</div>
            <div class="secundario">Desbloqueado el <span data-campo="fecha">01/01/2026</span></div>
        </div>
    </template>

    <script src="js/api.js"></script>
    <script src="js/componentes/toast.js"></script>
    <script src="js/pantallas/_comun.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/guardia.js"></script>
    <script src="js/pantallas/perfil.js"></script>
</body>
</html>
