# Apache para Cathartes (dentro del contenedor).
# El proyecto se sirve completo desde la raíz porque los frontends llaman a las APIs con
# rutas relativas (../api-usuarios/public). Por eso hay que CERRAR a mano todo lo que no
# sea público: código, configuración, base de datos, tests y archivos subidos.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

DocumentRoot /var/www/html

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# El login manda al administrador a /backoffice/<pantalla> (así se arma la URL cuando cada app
# tiene su propio document root). Acá las apps cuelgan de la raíz y su entrada real es
# /backoffice/public/<pantalla>: se redirige, y no se toca nada de app/, config/ ni routes/.
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/backoffice/public(/|$)
    RewriteCond %{REQUEST_URI} !^/backoffice/(app|config|routes)(/|$)
    RewriteRule ^/backoffice/?(.*)$ /backoffice/public/$1 [R=302,L,QSA]
</IfModule>

# Código y configuración de las apps: nunca por web (solo se entra por public/).
<DirectoryMatch "^/var/www/html/(api-usuarios|api-gestion|api-recoleccion|backoffice)/(app|config|routes)(/|$)">
    Require all denied
</DirectoryMatch>

# Carpetas internas del proyecto.
<DirectoryMatch "^/var/www/html/(db|tests|docs|storage|docker|\.git|\.github)(/|$)">
    Require all denied
</DirectoryMatch>

# Archivos que nunca se sirven: .env, dumps, documentación, scripts, configuración de herramientas.
<FilesMatch "^\.(env|git)|\.(sql|md|sh|yml|yaml|xml|lock|dist|log)$|^(Dockerfile.*)$">
    Require all denied
</FilesMatch>

# Cabeceras básicas de seguridad.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
